name: Update the tree extractor

# When open-paleo/tree-extractor publishes a release, it sends a tree-extractor-released
# notification with client_payload { version, tag, tarball_url, integrity }. This workflow pins
# the new release, checks the tarball is the one announced, and opens a pull request, on which
# CI runs every check; nothing deploys until a maintainer merges it.
#
# The branch is pushed and the pull request opened with WEB_DISPATCH_TOKEN, the fine-grained
# token tree-extractor sends the notification with (Contents and Pull requests: read and write
# on this repository). A pull request opened with GitHub's built-in token would leave its CI run
# waiting for a maintainer's approval. The token is used only in the last step: the checkout
# keeps no credentials, so the release's install scripts cannot read it.
#
# The payload is read through environment variables and checked before use, never pasted into
# a command, so a malformed notification cannot inject one.
on:
  repository_dispatch:
    types: [tree-extractor-released]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # node_modules is restored from the cache CI and Deploy keep, but never saved here: the next
      # step changes it, and saving that under the old lockfile's key would hand the new release
      # to runs that expect the old one.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Pin the release
        env:
          VERSION: ${{ github.event.client_payload.version }}
          TARBALL_URL: ${{ github.event.client_payload.tarball_url }}
          INTEGRITY: ${{ github.event.client_payload.integrity }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Not a version: $VERSION" >&2
            exit 1
          fi
          case "$TARBALL_URL" in
            "https://github.com/open-paleo/tree-extractor/releases/download/"*) ;;
            *) echo "Not a tree-extractor release asset: $TARBALL_URL" >&2; exit 1 ;;
          esac
          npm install --save-exact "$TARBALL_URL"
          locked=$(node -p 'require("./package-lock.json").packages["node_modules/@open-paleo/tree-extractor"].integrity')
          if [ -n "$INTEGRITY" ] && [ "$locked" != "$INTEGRITY" ]; then
            echo "The downloaded tarball's integrity ($locked) is not the one the release announced ($INTEGRITY)" >&2
            exit 1
          fi

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.event.client_payload.version }}
          TAG: ${{ github.event.client_payload.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="tree-extractor-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json package-lock.json
          git commit -m "Update the tree extractor to $VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "$branch"
          {
            echo "Pins @open-paleo/tree-extractor $VERSION ([release notes](https://github.com/open-paleo/tree-extractor/releases/tag/$TAG))."
            echo
            echo "Pinned, with the tarball's integrity checked against the release, in [this run]($RUN_URL). CI runs the type check, lint, tests, build and site check (which runs the tool on a figure) on this pull request."
            echo
            echo "Before merging, check the release's README for the Tesseract files it is tested against. If tesseract.js, tesseract.js-core or @tesseract.js-data/eng changed, update their pins in package.json in this pull request."
          } > pull-request-body.md
          gh pr create --base main --head "$branch" --title "Update the tree extractor to $VERSION" --body-file pull-request-body.md
