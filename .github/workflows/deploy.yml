name: Deploy

# Builds the site against open-paleo/data and publishes it to GitHub Pages at
# https://open-paleo.org.
#
# - push to main: the site changed; build against the data repository's main.
# - repository_dispatch (data-updated): the data repository's build published new output;
#   build against the exact data commit in the payload, since main can be served stale for a
#   few minutes after a push.
# - workflow_dispatch: run by hand from the Actions tab.
# - schedule: nightly, in case a data-updated notification was missed.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A deployment already running finishes rather than being
# cancelled, so the published site is never left half updated.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1
  SITE_URL: https://open-paleo.org
  SITE_BASE: /

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only dist/ is checked out: the site reads nothing else from the data repository.
      - name: Checkout dataset
        uses: actions/checkout@v7
        with:
          repository: open-paleo/data
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: data
          sparse-checkout: dist
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # node_modules is cached whole, keyed by the lockfile, so a run whose dependencies have not
      # changed skips npm ci, most of its install time; any change to package-lock.json misses.
      # Caches written by a pull request stay with that pull request, so they never reach main.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npm run build

      # New data can break a page as easily as new code, so every deployment runs the site
      # checks. When they fail, the live site stays at the last version that passed.
      # Chromium's headless shell is cached, keyed by the lockfile (which pins Playwright); its
      # system libraries are not part of the cache, so they are installed on every run.
      - name: Restore Chromium
        id: chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        # Retried: installing the system libraries downloads packages from Ubuntu's servers, and a
        # brief network failure there (as on the 2026-11-11 nightly run) should not fail the run.
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps --only-shell chromium && exit 0
            echo "Attempt $attempt failed; retrying in 30 seconds" >&2
            sleep 30
          done
          exit 1

      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        # Retried: installing the system libraries downloads packages from Ubuntu's servers, and a
        # brief network failure there (as on the 2026-11-11 nightly run) should not fail the run.
        run: |
          for attempt in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "Attempt $attempt failed; retrying in 30 seconds" >&2
            sleep 30
          done
          exit 1

      - name: Check the built site
        run: npm run check-site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
