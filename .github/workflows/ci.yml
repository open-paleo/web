name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The build reads the dataset from ./data/dist. Only dist/ is checked out: the site
      # reads nothing else from the data repository.
      - name: Checkout dataset
        uses: actions/checkout@v6
        with:
          repository: open-paleo/data
          path: data
          sparse-checkout: dist
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Spell check
        run: npm run spellcheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
